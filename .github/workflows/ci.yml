name: CI

# Builds and tests Takeheed on GitHub-hosted runners. No secrets here, so it is safe on pull requests.
#
#   xcode-27        The build, on GitHub's preview image with Xcode 27: swift test, an unsigned universal Release
#                   build that must produce no warnings in NameAlert/ or Packages/, and the Screenshots scheme
#                   tests (every render and logic test of the app's views). It uses the newest Xcode that is not a
#                   beta, which is the toolchain appstore.yml and release.yml ship with.
#   macos-26        swift test with Xcode 26.x, so the package keeps building with the previous toolchain
#   macos-15        swift test only, so the code paths for older macOS versions run too. If that image has no
#                   Xcode 26 or later, the leg ends early and the job still passes.
#   macos-26-intel  An x86_64 Mac, the only place the Intel slice of whisper.cpp runs: swift test, then the
#                   whisper tests on the real Light model (NAMEALERT_INTEGRATION=1, models cached).

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            full: true
            optional: false
            whisper: false
            beta: false
          - os: macos-26
            full: false
            optional: false
            whisper: false
            beta: true
          - os: macos-15
            full: false
            optional: true
            whisper: false
            beta: true
          - os: macos-26-intel
            full: false
            optional: false
            whisper: true
            beta: true
    steps:
      - name: Select the newest Xcode (26 or later)
        id: xcode
        env:
          XCODE_MIN_MAJOR: '26'
          XCODE_SKIP_IF_MISSING: ${{ matrix.optional }}
          XCODE_ALLOW_BETA: ${{ matrix.beta }}
        run: |
          # Picks the highest Xcode in /Applications whose version is at least XCODE_MIN_MAJOR.
          # A beta is fine on the compatibility legs: they only build and test, they never upload anything. The
          # build leg skips betas, because it should build with what appstore.yml and release.yml ship with.
          best_key=0
          best_app=""
          best_version=""
          seen=""
          version_re='^[0-9]+(\.[0-9]+){0,2}$'
          for app in /Applications/Xcode*.app; do
            [[ -f "$app/Contents/version.plist" ]] || continue
            real="$(cd -P "$app" && pwd)"
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$real/Contents/version.plist" 2>/dev/null || true)"
            seen="$seen $(basename "$real")($version)"
            [[ "$version" =~ $version_re ]] || continue
            IFS=. read -r major minor patch <<<"$version"
            (( major >= XCODE_MIN_MAJOR )) || continue
            if [[ "$XCODE_ALLOW_BETA" != "true" ]]; then
              case "$(basename "$real")" in
                *[Bb]eta*) continue ;;
              esac
            fi
            key=$(( major * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
            if (( key > best_key )); then
              best_key=$key
              best_app=$real
              best_version=$version
            fi
          done
          if [[ -z "$best_app" ]]; then
            if [[ "$XCODE_SKIP_IF_MISSING" == "true" ]]; then
              echo "::notice::No Xcode $XCODE_MIN_MAJOR or later on this runner image (found:${seen:- none}). Skipping the remaining steps."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No Xcode $XCODE_MIN_MAJOR or later (beta allowed: $XCODE_ALLOW_BETA) on this runner image (found:${seen:- none})."
            exit 1
          fi
          echo "Using $best_app (Xcode $best_version)"
          sudo xcode-select -s "$best_app/Contents/Developer"
          xcodebuild -version
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out the code
        if: steps.xcode.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache SwiftPM binary artifacts
        if: steps.xcode.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: Packages/NameAlertKit/.build/artifacts
          # The package has one binary dependency (the whisper.cpp xcframework). Its URL and checksum live in
          # Package.swift, and Package.resolved is gitignored and may not exist, so both files go into the key.
          key: ${{ runner.os }}-${{ runner.arch }}-spm-artifacts-${{ hashFiles('Packages/NameAlertKit/Package.resolved', 'Packages/NameAlertKit/Package.swift') }}

      - name: Run the package tests
        if: steps.xcode.outputs.skip != 'true'
        # One test at a time. A runner has 3 or 4 cores and builds the tests unoptimized. Side by side, the CPU-bound
        # tests (rule matching on a long transcript) hold the threads that the tests with real timers (debounced
        # writes, channel time-outs) need, so those wait for a write that comes late or time out a second too late.
        run: swift test --package-path Packages/NameAlertKit --no-parallel

      - name: Cache the whisper models
        if: steps.xcode.outputs.skip != 'true' && matrix.whisper
        uses: actions/cache@v4
        with:
          # Where the whisper tests keep the models they download (the system cache folder, in
          # NameAlertTests/Models). The catalog holds every model's URL and checksum, so a change there
          # starts a new cache.
          path: ~/Library/Caches/NameAlertTests/Models
          key: ${{ runner.os }}-${{ runner.arch }}-whisper-models-${{ hashFiles('Packages/NameAlertKit/Sources/NameAlertSpeech/ModelCatalog.swift') }}

      - name: Run the whisper tests on the real models
        if: steps.xcode.outputs.skip != 'true' && matrix.whisper
        env:
          NAMEALERT_INTEGRATION: '1'
        # WhisperEngineTests only. The other opt-in tests need permissions or hardware that a runner does not have,
        # and the performance test is for scripts/verify.sh. One at a time, as in the step above.
        run: swift test --package-path Packages/NameAlertKit --filter WhisperEngineTests --no-parallel

      - name: Install XcodeGen 2.46.0
        if: steps.xcode.outputs.skip != 'true' && matrix.full
        env:
          XCODEGEN_VERSION: '2.46.0'
          # The SHA-256 GitHub reports for xcodegen.zip in that release. appstore.yml and release.yml install the
          # same version the same way: change all three together.
          XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
        run: |
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          dir="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          rm -rf "$dir"
          mkdir -p "$dir"
          unzip -q "$zip" -d "$dir"
          # The zip holds xcodegen/bin/xcodegen and xcodegen/share/xcodegen/SettingPresets, which it finds by its own path.
          echo "$dir/xcodegen/bin" >> "$GITHUB_PATH"
          "$dir/xcodegen/bin/xcodegen" --version

      - name: Generate the Xcode project
        if: steps.xcode.outputs.skip != 'true' && matrix.full
        run: xcodegen generate

      - name: Build a universal Release app without signing
        if: steps.xcode.outputs.skip != 'true' && matrix.full
        run: |
          mkdir -p build
          xcodebuild build \
            -project NameAlert.xcodeproj \
            -scheme NameAlert \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/build.log

      - name: Run the Screenshots scheme tests
        if: steps.xcode.outputs.skip != 'true' && matrix.full
        run: |
          # Every render and logic test of the app's views, in the screenshot host (a Debug build of the app's sources
          # without its @main). The views are drawn in offscreen windows, which the runner's login session allows.
          # The renders go to build/renders; the store screenshots are only written by scripts/render_screenshots.sh.
          # If the tests fail they run once more. On a fresh runner the first purchase through StoreKit
          # (ProStoreTests.buyingUnlocks) did not return before its 2 minute time limit ended it, in every run so far,
          # and the purchases after the restart of the test process finished at once. (xcodebuild's own
          # -retry-tests-on-failure does not run again a test that a time limit ended.) A test that is really broken
          # fails both times, and so does the job.
          : > build/screenshots-tests.log
          run_screenshot_tests() {
            xcodebuild test \
              -project NameAlert.xcodeproj \
              -scheme Screenshots \
              -destination 'platform=macOS' \
              -derivedDataPath build/DerivedData-tests \
              -testLanguage en -testRegion US \
              2>&1 | tee -a build/screenshots-tests.log
          }
          if ! run_screenshot_tests; then
            echo "::warning::The Screenshots scheme tests failed. Running them once more."
            run_screenshot_tests
          fi

      - name: Fail on warnings in NameAlert/ and Packages/
        if: steps.xcode.outputs.skip != 'true' && matrix.full
        run: |
          # Only warnings that point into our own sources count: a path that starts with this checkout's NameAlert/
          # or Packages/ folder. Xcode's own messages, such as the appintentsmetadataprocessor ones, do not start
          # with a path, and nothing under build/ (derived data, resolved packages) is ours.
          workspace="$(printf '%s' "$GITHUB_WORKSPACE" | sed -e 's/[][\.*^$+?(){}|]/\\&/g')"
          if grep -h -E "^$workspace/(NameAlert|Packages)/.*: warning:" build/build.log build/screenshots-tests.log; then
            echo "::error::The build or the Screenshots tests produced warnings in NameAlert/ or Packages/ (listed above). The project builds with none."
            exit 1
          fi
          echo "No warnings in NameAlert/ or Packages/."

      - name: Check that the app is universal
        if: steps.xcode.outputs.skip != 'true' && matrix.full
        run: |
          app="build/DerivedData/Build/Products/Release/Takeheed.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::$app was not built."
            exit 1
          fi
          bad=0
          count=0
          while IFS= read -r -d '' file; do
            archs="$(lipo -archs "$file" 2>/dev/null)" || continue
            count=$((count + 1))
            for arch in arm64 x86_64; do
              case " $archs " in
                *" $arch "*) ;;
                *)
                  echo "::error::${file#"$app"/} has no $arch slice (it has: $archs)."
                  bad=1
                  ;;
              esac
            done
          done < <(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) -print0)
          if [[ $count -eq 0 ]]; then
            echo "::error::Found no Mach-O files in $app."
            exit 1
          fi
          if [[ $bad -ne 0 ]]; then
            exit 1
          fi
          echo "All $count Mach-O files in the app include arm64 and x86_64."

      - name: Check that the Release build sells nothing
        if: steps.xcode.outputs.skip != 'true' && matrix.full
        run: |
          # Only the Mac App Store archive is built with APP_STORE_BUILD (scripts/build_appstore.sh). This build must have
          # everything on and no purchase.
          bash scripts/check_purchase_mode.sh build/DerivedData/Build/Products/Release/Takeheed.app --does-not-sell
