name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode with macOS 26 SDK
        run: |
          echo "=== Available Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "None found in /Applications"

          echo "=== SDKs available ==="
          for xcode in /Applications/Xcode*.app; do
            sdk_dir="$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
            echo "--- $xcode ---"
            ls "$sdk_dir" 2>/dev/null || echo "  No SDKs found"
            xcodebuild -version 2>/dev/null
          done

          echo "=== xcode-select current ==="
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild -project NameAlert.xcodeproj -scheme NameAlert \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package DMG
        run: |
          APP_PATH="build/Build/Products/Release/NameAlert.app"
          DMG_NAME="NameAlert"
          STAGING="dmg-staging"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "$DMG_NAME" -srcfolder "$STAGING" \
            -ov -format UDZO "${DMG_NAME}.dmg"

          rm -rf "$STAGING"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NameAlert.dmg
          path: NameAlert.dmg
