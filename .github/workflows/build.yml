name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode with macOS 26 SDK
        run: |
          for xcode in /Applications/Xcode*.app; do
            sdk_path="$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.sdk"
            if [ -d "$sdk_path" ]; then
              echo "Found macOS 26 SDK in $(basename $xcode .app)"
              sudo xcode-select -s "$xcode"
              xcodebuild -version
              break
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild -project NameAlert.xcodeproj -scheme NameAlert \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package DMG
        run: |
          APP_PATH="build/Build/Products/Release/NameAlert.app"
          DMG_NAME="NameAlert"
          STAGING="dmg-staging"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "$DMG_NAME" -srcfolder "$STAGING" \
            -ov -format UDZO "${DMG_NAME}.dmg"

          rm -rf "$STAGING"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NameAlert.dmg
          path: NameAlert.dmg

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="continuous"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "NameAlert (continuous)" \
            --notes "Latest automated build from \`${GITHUB_SHA:0:7}\`." \
            NameAlert.dmg
