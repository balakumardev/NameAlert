name: NameAlert
options:
  bundleIdPrefix: dev.balakumar
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing so local builds run without a certificate (the app's Debug build is the exception, below); release
    # scripts sign with explicit identities.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: KHD36T7C97
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  NameAlertKit:
    path: Packages/NameAlertKit
targets:
  NameAlert:
    type: application
    platform: macOS
    sources:
      - path: NameAlert
        excludes:
          - "Info.plist"
          - "NameAlert.entitlements"
    dependencies:
      - package: NameAlertKit
        product: NameAlertKit
    info:
      path: NameAlert/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Takeheed
        # The name people see; the app reads it through AppInfo.displayName, so renaming the app is this one value
        # (the screenshot host below reuses it through the anchor).
        CFBundleDisplayName: &displayName Takeheed
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 CoolSolve LLP"
        CFBundleURLTypes:
          - CFBundleURLName: dev.balakumar.namealert
            CFBundleURLSchemes:
              - takeheed
        NSMicrophoneUsageDescription: "Takeheed listens to your microphone on this Mac to notice when someone says your name."
        NSSpeechRecognitionUsageDescription: "Takeheed turns speech into text on this Mac so it can spot your name and keywords."
        NSScreenCaptureUsageDescription: "Takeheed listens to audio from calls and videos on this Mac to notice when someone says your name."
        # Shown when an alert goes to a server on the user's own network (a self-hosted ntfy or webhook).
        NSLocalNetworkUsageDescription: "Takeheed sends alerts to a server on your local network, like a self-hosted ntfy or webhook, when you set one up."
        # Plain http is accepted only for alert servers on the user's own network (ChannelSettings.isLocalNetworkHost);
        # this is what lets those requests through App Transport Security. Everything else must be https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: NameAlert/NameAlert.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.balakumar.namealert
        # The bundle is Takeheed.app, its executable Takeheed. The Swift module keeps the name NameAlert, so the App
        # Intents and anything else recorded under the module's name stay as they are. Only on this target: the
        # screenshot host, its tests (TEST_HOST, @testable import ScreenshotHost) and the package keep their names.
        PRODUCT_NAME: Takeheed
        PRODUCT_MODULE_NAME: NameAlert
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NameAlert/Info.plist
        CODE_SIGN_ENTITLEMENTS: NameAlert/NameAlert.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          # A development certificate, not ad hoc: the designated requirement then names the certificate instead of the
          # build's hash, so macOS keeps the Screen Recording and Microphone grants across rebuilds. This identity's key
          # lets codesign use it without asking for the login keychain password.
          CODE_SIGN_IDENTITY: "Apple Development: Created via API (G6HDNFTZS4)"

  # Hosts the render and screenshot tests: the app's views and logic without its @main, Info.plist or entitlements,
  # so it never listens, is not sandboxed (renders are written into the repository), claims no URL scheme and
  # registers no App Intents or Shortcuts.
  ScreenshotHost:
    type: application
    platform: macOS
    sources:
      - path: NameAlert
        excludes:
          - "Info.plist"
          - "NameAlert.entitlements"
          - "App/NameAlertApp.swift"
          - "Intents"
      - path: ScreenshotHost
    dependencies:
      - package: NameAlertKit
        product: NameAlertKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.balakumar.namealert.screenshots-host
        GENERATE_INFOPLIST_FILE: YES
        # Explicitly none: XcodeGen would otherwise pick up NameAlert/Info.plist from the sources, and the host would
        # claim the takeheed:// scheme and take the app's links.
        INFOPLIST_FILE: ""
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: *displayName
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # So that About and Welcome render with the app's icon (NSApp.applicationIconImage).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREENSHOT_HOST"
        # The test bundle links nothing itself: it resolves the app's and NameAlertKit's symbols in this executable
        # (BUNDLE_LOADER), so keep them all here, in the executable, and loadable by an ad-hoc signed bundle.
        DEAD_CODE_STRIPPING: NO
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES

  # Renders every screen state to build/renders/*.png (git-ignored) for review, and later the App Store screenshots.
  NameAlertScreenshots:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NameAlertScreenshots
    dependencies:
      - target: ScreenshotHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.balakumar.namealert.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScreenshotHost.app/Contents/MacOS/ScreenshotHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  NameAlert:
    build:
      targets:
        NameAlert: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  Screenshots:
    build:
      targets:
        ScreenshotHost: all
        NameAlertScreenshots: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NameAlertScreenshots
