name: NameAlert
options:
  bundleIdPrefix: dev.balakumar
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing so local builds run; release scripts sign with explicit identities.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: KHD36T7C97
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  NameAlertKit:
    path: Packages/NameAlertKit
targets:
  NameAlert:
    type: application
    platform: macOS
    sources:
      - path: NameAlert
        excludes:
          - "Info.plist"
          - "NameAlert.entitlements"
    dependencies:
      - package: NameAlertKit
        product: NameAlertKit
    info:
      path: NameAlert/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: NameAlert
        CFBundleDisplayName: NameAlert
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 CoolSolve LLP"
        CFBundleURLTypes:
          - CFBundleURLName: dev.balakumar.namealert
            CFBundleURLSchemes:
              - namealert
        NSMicrophoneUsageDescription: "NameAlert listens to your microphone on this Mac to notice when someone says your name."
        NSSpeechRecognitionUsageDescription: "NameAlert turns speech into text on this Mac so it can spot your name and keywords."
        NSScreenCaptureUsageDescription: "NameAlert listens to audio from calls and videos on this Mac to notice when someone says your name."
        # Plain http is accepted only for alert servers on the user's own network (ChannelSettings.isLocalNetworkHost);
        # this is what lets those requests through App Transport Security. Everything else must be https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: NameAlert/NameAlert.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.balakumar.namealert
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NameAlert/Info.plist
        CODE_SIGN_ENTITLEMENTS: NameAlert/NameAlert.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
schemes:
  NameAlert:
    build:
      targets:
        NameAlert: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
